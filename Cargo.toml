[workspace]
resolver = "3"
members = ["crates/core", "crates/gdrive", "crates/service", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.90: exigido pelo Tauri 2.12 (e File::lock/try_lock, desde 1.89, em lock.rs)
rust-version = "1.90"
publish = false

[workspace.dependencies]
syncly-core = { path = "crates/core" }
syncly-gdrive = { path = "crates/gdrive" }
syncly-service = { path = "crates/service" }

async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
fs4 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
ignore = "0.4"
keyring = "4"
md-5 = "0.11"
open = "5"
rayon = "1"
# SEG-40: rustls (padrão no 0.13); sem proxy do sistema.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "macros", "net", "time"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wiremock = "0.6"
# Só deflate/deflate64 (Rust puro); sem compressores em C além do zstd.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
zstd = { version = "0.14", default-features = false, features = ["zstdmt"] }
# Já vem com o keyring (Secret Service); usado direto para as notificações (RN-94) e para
# ler o tema do sistema no app desktop.
zbus = "5"

# SEG-50
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
